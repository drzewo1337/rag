networks:
  rag_service_network: 
    driver: bridge

volumes:
  database_data:
  rabbitmq_data:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_service_db
    ports:
      - 5432:5432
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_service_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - rag_service_network


  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    ports:
      - 15672:15672
      - 5672:5672
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - rag_service_network
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST}

  ask_response_service:
    build:
      context: .
      dockerfile: ask_reponse_service/dockerfile
    command:
      [
        "uvicorn",
        "ask_reponse_service.ask_response_controller:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]
    ports:
      - 8001:8001
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db
      RABBIT_HOST: rabbitmq
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8001/health'', timeout=2)"',
        ]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 15s
    networks:
      - rag_service_network


  rag_service:
    build:
      context: .
      dockerfile: rag_service/dockerfile
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ask_response_service:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "rag_service.rag_controller:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]
    ports:
      - 8002:8002
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db
      OLLAMA_HOST: http://host.docker.internal:11434
      RABBIT_HOST: rabbitmq
      ASK_RESPONSE_SERVICE_URL: http://ask_response_service:8001
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8002/health'', timeout=2)"',
        ]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag_service_network


  facts_service:
    build:
      context: .
      dockerfile: facts_service/dockerfile
    command:
      [
        "uvicorn",
        "facts_service.facts_controller:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db
      OLLAMA_HOST: http://host.docker.internal:11434
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=2)"',
        ]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 300s
    networks: 
      - rag_service_network