services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_service_db
    ports:
      - 5432:5432
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_service_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db

      OLLAMA_HOST: http://host.docker.internal:11434

volumes:
  database_data:
