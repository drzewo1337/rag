services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_service_db
    ports:
      - 5432:5432
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_service_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  ask_response_service:
    build:
      context: .
    command:
      [
        "uvicorn",
        "ask_reponse_service.ask_response_controller:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]
    ports:
      - 8001:8001
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8001/health'', timeout=2)"',
        ]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 15s

  facts_service:
    build:
      context: .
    command:
      [
        "uvicorn",
        "facts_service.facts_controller:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy
      ask_response_service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/rag_service_db
      OLLAMA_HOST: http://host.docker.internal:11434
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=2)"',
        ]
      interval: 10s
      timeout: 60s
      retries: 30
      start_period: 300s

volumes:
  database_data:
